[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "day09-l3b-student-agent"
version = "0.1.0"
description = "Starter kit for the Day09 L3B Multi-Agent MCP + A2A competition"
requires-python = ">=3.11"
dependencies = [
    "httpx2==2.13.1",
    "jsonschema[format]==4.26.0",
    "mcp==2.2.0",
    "python-dotenv==1.2.3",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.16.9"]

[project.scripts]
day09 = "student_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
